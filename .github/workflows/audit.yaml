name: Dependency Audit
on: push

jobs:
  audit:
    name: yarn audit (high/critical must pass)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '25'
          corepack: true

      - name: Enable Corepack
        run: corepack enable

      # Runs `yarn audit` against yarn.lock (no install needed) and fails on
      # any high/critical advisory not allowlisted (with justification) in
      # scripts/audit-allowlist.json (no allowlist exists today).
      - name: Audit dependencies
        run: node scripts/audit-check.js
