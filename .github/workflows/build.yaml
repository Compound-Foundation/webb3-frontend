name: Build & Push to IPFS
on: push

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
      pull-requests: write
    steps:
      - name: Build Note for ${{ github.ref }}
        run: |
          echo Building ${GITHUB_REF}...

      - uses: chrnorm/deployment-action@v2
        name: Create GitHub deployment
        id: deployment
        with:
          token: '${{ github.token }}'
          environment: production

      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '25'
          corepack: true

      - name: Enable Corepack
        run: corepack enable

      - name: Install Node Dependencies
        run: yarn install

      - name: Build App
        run: yarn run build
        env:
          VITE_V3_API_HOST: ${{secrets.VITE_V3_API_HOST}}
          VITE_V3_GAS_SUFFIX: ${{secrets.VITE_V3_GAS_SUFFIX}}
          VITE_V3_RPC_PROVIDER_HOST: ${{secrets.VITE_V3_RPC_PROVIDER_HOST}}
          VITE_V3_WALLET_CONNECT_PROJECT_ID: ${{secrets.VITE_V3_WALLET_CONNECT_PROJECT_ID}}
          VITE_SCREENING_ENDPOINT: ${{secrets.VITE_SCREENING_ENDPOINT}}
          VITE_TURNSTILE_SITE_KEY: ${{secrets.VITE_TURNSTILE_SITE_KEY}}

      - name: Archive App
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to IPFS
        id: ipfs
        run: |
          node scripts/ipfs.js | tee .release-notes
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
          PINATA_GATEWAY_URL: ${{ secrets.PINATA_GATEWAY_URL }}

      - name: Upload IPFS Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: .release
          include-hidden-files: true
          path: .release

      - name: Echo
        run: |
          echo "Release URL: ${{ env.RELEASE_URL }}"
          echo "IPFS URL:    ${{ env.IPFS_URL }}"
          echo "CID:         ${{ env.IPFS_CID }}"

      # Post (or refresh) a single sticky comment with the preview links on
      # every open PR for this commit. Covers PRs whose head is this branch
      # and PRs from forks whose branch a maintainer mirrored into this repo.
      - name: Post preview links to PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          MARKER='<!-- ipfs-preview-comment -->'

          PRS=$(
            {
              gh pr list --repo "$REPO" --state open --head "$BRANCH" --json number --jq '.[].number' || true
              gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[] | select(.state == "open") | .number' || true
            } | sort -un
          )

          if [ -z "$PRS" ]; then
            echo "No open pull request for $BRANCH @ $SHA; skipping comment."
            exit 0
          fi

          SHORT_SHA=$(echo "$SHA" | cut -c1-7)
          BODY=$(cat <<EOT
          $MARKER
          ### IPFS preview

          Built from \`$SHORT_SHA\` on \`$BRANCH\`.

          - Pinata: $PINATA_URL
          - IPFS: $IPFS_URL
          - CID: \`$IPFS_CID\`

          [Build run]($RUN_URL)
          EOT
          )

          for PR in $PRS; do
            EXISTING=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --slurp \
              --jq "[.[][] | select(.body | contains(\"$MARKER\")) | .id][0] // empty")
            if [ -n "$EXISTING" ]; then
              gh api --method PATCH "repos/$REPO/issues/comments/$EXISTING" -f body="$BODY" > /dev/null
              echo "Updated preview comment on PR #$PR"
            else
              gh api --method POST "repos/$REPO/issues/$PR/comments" -f body="$BODY" > /dev/null
              echo "Posted preview comment on PR #$PR"
            fi
          done

      - name: Update deployment status (success)
        if: success()
        uses: chrnorm/deployment-status@v2
        with:
          token: '${{ github.token }}'
          environment-url: '${{ env.RELEASE_URL }}'
          state: 'success'
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}

      - name: Update deployment status (failure)
        if: failure()
        uses: chrnorm/deployment-status@v2
        with:
          token: '${{ github.token }}'
          environment-url: '${{ env.RELEASE_URL }}'
          state: 'failure'
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
