name: Check types and linting
on:
  workflow_dispatch:
  pull_request:
jobs:
  check-types:
    name: Check types and linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '26'

      - name: Install and enable Corepack
        run: |
          npm install --global corepack@0.36.0
          corepack enable

      - name: Install packages
        run: yarn install

      - name: Enumerate
        run: find src

      - name: Check types
        run: npx tsc

      - name: Check linting
        run: yarn lint
